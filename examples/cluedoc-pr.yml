# Sync Cluedoc papers into every pull request.
#
# Papers are a generated artifact derived from the code, so this treats them the
# way you would treat a lockfile or a generated API client: the bot writes them
# into the PR branch, so the docs are reviewed and merged atomically with the
# change that caused them.
#
# Copy to .github/workflows/cluedoc.yml and add an ANTHROPIC_API_KEY secret.

name: Cluedoc

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  cluedoc:
    uses: KeunwooPark/cluedoc/.github/workflows/cluedoc.yml@v1
    secrets:
      api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    # Only needed if this repository's default GITHUB_TOKEN is read-only:
    # a called workflow cannot be granted more than its caller holds.
    # permissions:
    #   contents: write
    #   pull-requests: write
