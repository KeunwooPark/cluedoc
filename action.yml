name: Cluedoc
description: Documentation that keeps up with coding agents — one visual paper per feature, synced into every pull request.
author: keunwoo

branding:
  icon: book-open
  color: blue

inputs:
  api_key:
    description: >-
      API key for the model provider, sent as `Authorization: Bearer`.
    required: true
  base_url:
    description: >-
      Base URL of any endpoint that speaks OpenAI chat completions —
      your own gateway, a hosted one, or a provider's compatibility endpoint.
      `/chat/completions` is appended to it.
    required: false
    default: https://api.openai.com/v1
  model:
    description: Model the agent runs on, named as the provider names it.
    required: false
    default: gpt-5
  scope:
    description: >-
      Explicit git diff range to document, e.g. `main...HEAD`. Inferred from the
      event when empty; pass `all` to document the whole repository.
    required: false
    default: ""
  github_token:
    description: >-
      Token the agent pushes with. Leave as the default `GITHUB_TOKEN`: a
      `synchronize` it causes requires manual approval to run, which is what
      stops the docs commit re-triggering this workflow.
    required: false
    default: ${{ github.token }}
  push:
    description: >-
      Commit and push the papers. Set false to leave them in the working tree
      for a following step to deal with.
    required: false
    default: "true"
  commit_message:
    description: Commit message for the docs commit.
    required: false
    default: "docs(cluedoc): sync papers"
  bootstrap:
    description: >-
      What to do in a repository that has no `.cluedoc/` yet. `auto` writes the
      starter tree of papers; `full` also wires the sync trigger into the repo's
      agent-instructions file; `skip` does nothing and exits clean.
    required: false
    default: auto
  max_turns:
    description: >-
      How many times the agent may call tools before the run is abandoned. Raise
      it for a large first bootstrap; the default is ample for a scoped sync.
    required: false
    default: "30"
  max_tokens:
    description: >-
      Cap on the tokens the model may produce per turn. Left unset by default,
      because several current models reject the parameter outright.
    required: false
    default: ""
  temperature:
    description: >-
      Sampling temperature. Left unset by default, for the same reason.
    required: false
    default: ""

outputs:
  changed:
    description: '"true" when papers were written, "false" otherwise.'
    value: ${{ steps.commit.outputs.changed }}
  papers:
    description: Newline-separated paths of the papers that changed.
    value: ${{ steps.commit.outputs.papers }}
  commit:
    description: SHA of the docs commit; empty when nothing changed.
    value: ${{ steps.commit.outputs.commit }}

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- preflight
    # Three situations where running is wrong rather than merely unnecessary.
    # Each exits clean and says why in the run summary: a contributor whose fork
    # PR produced no papers has no other way to find out that is expected.
    - id: preflight
      shell: bash
      run: |
        set -euo pipefail
        skip=""

        case "$GITHUB_EVENT_NAME" in
          pull_request|pull_request_target)
            head_repo=$(jq -r '.pull_request.head.repo.full_name // ""' "$GITHUB_EVENT_PATH")
            draft=$(jq -r '.pull_request.draft // false' "$GITHUB_EVENT_PATH")

            # A fork PR gets no secrets and a read-only token, so the agent
            # cannot run and cannot push. Run the companion workflow on the
            # default branch to pick these up after the merge instead.
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              skip="this pull request comes from a fork, where secrets and write access are unavailable"
            elif [ "$draft" = "true" ]; then
              skip="this pull request is a draft"
            fi
            ;;
        esac

        # Our own docs commit must not start another run. The token guard above
        # is the real defence; this is the second one, and the only one that
        # applies on `push`.
        if [ -z "$skip" ]; then
          sender=$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")
          if [ "$sender" = "github-actions[bot]" ]; then
            skip="this run was triggered by github-actions[bot]"
          fi
        fi

        if [ -n "$skip" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Cluedoc skipped: ${skip}." >> "$GITHUB_STEP_SUMMARY"
          echo "Cluedoc skipped: ${skip}."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # ------------------------------------------------------------------- mode
    # A repository with no `.cluedoc/` cannot be synced — there is no tree for a
    # diff to update. The skill has a different entry point for that, and this
    # is what reaches it.
    - id: mode
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        INPUT_BOOTSTRAP: ${{ inputs.bootstrap }}
      run: |
        set -euo pipefail

        # Every step after this one reads the repository: the engine to
        # document it, the commit step to push it. Without a checkout they fail
        # one after another, and none of the errors names the missing step.
        if [ ! -d "${GITHUB_WORKSPACE}/.git" ]; then
          echo "::warning::No git checkout in the workspace. Add actions/checkout before this action."
        fi

        if [ -d "${GITHUB_WORKSPACE}/.cluedoc" ] && [ -n "$(ls -A "${GITHUB_WORKSPACE}/.cluedoc" 2>/dev/null)" ]; then
          echo "mode=sync" >> "$GITHUB_OUTPUT"
          echo "paths=.cluedoc" >> "$GITHUB_OUTPUT"
          echo "write_scope=.cluedoc" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        case "$INPUT_BOOTSTRAP" in
          skip)
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No .cluedoc/ in this repository, and bootstrap is set to skip." >> "$GITHUB_STEP_SUMMARY"
            echo "No .cluedoc/ in this repository, and bootstrap is set to skip."
            ;;
          full)
            # The caller asked for the trigger wire-up, so the agent may write
            # outside .cluedoc/ and everything it touches is staged.
            echo "mode=bootstrap-full" >> "$GITHUB_OUTPUT"
            echo "paths=-A" >> "$GITHUB_OUTPUT"
            # Empty rather than absent: the engine reads an empty write scope as
            # "the whole tree", which is exactly what Job 2 needs and what no
            # other mode is allowed.
            echo "write_scope=" >> "$GITHUB_OUTPUT"
            echo "job2=Also do Job 2 — wire the sync trigger into the agent-instructions file." >> "$GITHUB_OUTPUT"
            ;;
          auto|"")
            # Papers only. `init`'s second job writes a block into AGENTS.md,
            # and that is a different kind of edit than a generated paper: the
            # argument for letting a bot commit papers unasked is that they are
            # derived, and an agent-instructions file is not.
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "paths=.cluedoc" >> "$GITHUB_OUTPUT"
            echo "write_scope=.cluedoc" >> "$GITHUB_OUTPUT"
            echo "job2=Do NOT do Job 2. Do not create or modify AGENTS.md, CLAUDE.md, or any other agent-instructions file. Write nothing outside .cluedoc/." >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unknown bootstrap value '${INPUT_BOOTSTRAP}'. Expected auto, full or skip."
            exit 1
            ;;
        esac

    # ------------------------------------------------------------------- scope
    # The examples hand-wrote a different `git diff` into each workflow's prompt.
    # Deriving it here is what lets a caller write no diff expression at all.
    - id: scope
      if: steps.mode.outputs.mode == 'sync'
      shell: bash
      env:
        INPUT_SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        range=""


        if [ "$INPUT_SCOPE" = "all" ]; then
          range=""
        elif [ -n "$INPUT_SCOPE" ]; then
          range="$INPUT_SCOPE"
        else
          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_target)
              base="$GITHUB_BASE_REF"
              git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
              # A shallow checkout has no merge base, and the git error for that
              # names neither the cause nor the fix.
              if ! git merge-base "origin/${base}" HEAD >/dev/null 2>&1; then
                echo "::error::No merge base with origin/${base}. Check out with 'fetch-depth: 0' so Cluedoc can scope the diff to this pull request."
                exit 1
              fi
              range="origin/${base}...HEAD"
              ;;
            push)
              before=$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")
              # A new branch reports an all-zero `before`, and a force-push can
              # report a commit that is no longer reachable. Both mean there is
              # no range, not an empty one.
              if [ -n "$before" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="${before}..${GITHUB_SHA}"
              fi
              ;;
          esac
        fi

        if [ -z "$range" ]; then
          echo "range=" >> "$GITHUB_OUTPUT"
          echo "empty=false" >> "$GITHUB_OUTPUT"
          echo "Cluedoc scope: the whole repository."
          exit 0
        fi

        # Caught rather than allowed to abort the step: an unresolvable range is
        # almost always a mistyped `scope`, and git's own message for it names
        # neither this input nor the workflow that set it.
        if ! changed=$(git diff --name-only "$range" 2>/dev/null | wc -l | tr -d ' '); then
          echo "::error::Cannot diff \`${range}\`. Check the 'scope' input, or that every ref it names exists in this checkout."
          exit 1
        fi

        echo "range=${range}" >> "$GITHUB_OUTPUT"

        # Nothing changed: stop before spending a single token. Common on merge
        # commits and on pushes that only touch tags.
        if [ "$changed" = "0" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
          echo "Cluedoc skipped: no files changed in ${range}." >> "$GITHUB_STEP_SUMMARY"
          echo "Cluedoc skipped: no files changed in ${range}."
        else
          echo "empty=false" >> "$GITHUB_OUTPUT"
          echo "Cluedoc scope: ${changed} changed file(s) in ${range}."
        fi

    # ------------------------------------------------------------------ prompt
    # Both prompts, in full, in one step — a prompt is the part of this action
    # most worth being able to read without executing it.
    #
    # The skill itself is not copied anywhere: the engine reads it straight out
    # of `$GITHUB_ACTION_PATH`, which is this repository at the ref the caller
    # pinned, so the skill and the prompt that drives it are the same version by
    # construction rather than by a clone that could drift.
    #
    # The heredocs interpolate, which is why neither prompt contains a backtick.
    - id: prompt
      name: Compose the prompt
      if: steps.mode.outputs.mode == 'sync' && steps.scope.outputs.empty != 'true' || startsWith(steps.mode.outputs.mode, 'bootstrap')
      shell: bash
      env:
        MODE: ${{ steps.mode.outputs.mode }}
        RANGE: ${{ steps.scope.outputs.range }}
        JOB2: ${{ steps.mode.outputs.job2 }}
      run: |
        set -euo pipefail
        file="${RUNNER_TEMP:-/tmp}/cluedoc-prompt.md"

        if [ "$MODE" = "sync" ]; then
          # The engine has a git_diff tool, so the range is handed over as data
          # for the agent to call rather than as a shell command to imitate.
          if [ -n "$RANGE" ]; then
            scope="The changes to document are the git range ${RANGE}. Start by calling git_diff with that range and name_only set, then read the files it lists."
          else
            scope="There is no diff range: consider the repository as a whole."
          fi

          cat > "$file" <<EOF
        Use the Cluedoc skill to sync .cluedoc/ with the code that changed.

        ${scope}

        Follow Cluedoc's progressive rule: update only the papers those changes
        affect, upward and downward. Do not re-document the repository, and do
        not rewrite a paper the change does not reach. If nothing needs
        changing, change nothing and say so.
        EOF
        else
          cat > "$file" <<EOF
        This repository has no .cluedoc/ yet. Run the Cluedoc skill's init
        command to bootstrap it.

        Do Job 1, the shallow breadth-first starter tree: the root paper at
        .cluedoc/README.md plus one paper per top-level feature. Do not recurse
        past the top level.

        ${JOB2}
        EOF
        fi

        echo "file=${file}" >> "$GITHUB_OUTPUT"
        echo "::group::Cluedoc prompt"
        cat "$file"
        echo "::endgroup::"

    # --------------------------------------------------------------------- run
    # The agent writes files and stops. It cannot commit — there is no shell
    # tool — and the step below stages, commits and pushes, which is what lets
    # this action resolve a paper conflict, report what changed, and honour
    # `push: false` with one code path instead of three.
    - name: Run the agent
      if: steps.prompt.outputs.file != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CLUEDOC_API_KEY: ${{ inputs.api_key }}
        CLUEDOC_BASE_URL: ${{ inputs.base_url }}
        CLUEDOC_MODEL: ${{ inputs.model }}
        CLUEDOC_MAX_TURNS: ${{ inputs.max_turns }}
        CLUEDOC_MAX_TOKENS: ${{ inputs.max_tokens }}
        CLUEDOC_TEMPERATURE: ${{ inputs.temperature }}
        CLUEDOC_WORKSPACE: ${{ github.workspace }}
        CLUEDOC_PROMPT_FILE: ${{ steps.prompt.outputs.file }}
        CLUEDOC_SKILL_FILE: ${{ github.action_path }}/SKILL.md
        # Empty on `bootstrap: full`, which is the one mode allowed to write
        # outside .cluedoc/. Set through an output rather than an inline
        # conditional: in a GitHub expression the empty string is falsy, so the
        # obvious `cond && '' || '.cluedoc'` silently yields '.cluedoc' in both
        # branches.
        CLUEDOC_WRITE_SCOPE: ${{ steps.mode.outputs.write_scope }}
      run: |
        set -euo pipefail

        # The engine is dependency-free and uses global fetch, so the only thing
        # it needs is a Node new enough to have one. Checked here because the
        # failure otherwise is a ReferenceError from inside a file the caller
        # did not write.
        if ! command -v node >/dev/null 2>&1; then
          echo "::error::node was not found on PATH. Add actions/setup-node before this action."
          exit 1
        fi
        major=$(node -p 'process.versions.node.split(".")[0]')
        if [ "$major" -lt 18 ]; then
          echo "::error::Node ${major} is too old; Cluedoc needs 18 or newer. Add actions/setup-node before this action."
          exit 1
        fi

        node "${GITHUB_ACTION_PATH}/engine/run.mjs"
    # ------------------------------------------------------------------ commit
    # Everything the agent produced is still in the working tree. This is the
    # only place that touches git history, which is what makes `changed`
    # trustworthy and lets a paper conflict be resolved rather than reported.
    - id: commit
      if: steps.mode.outputs.mode == 'sync' && steps.scope.outputs.empty != 'true' || startsWith(steps.mode.outputs.mode, 'bootstrap')
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        PATHS: ${{ steps.mode.outputs.paths }}
        BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      run: |
        set -euo pipefail
        papers=""

        # Every exit goes through here, so each output is written exactly once.
        # Appending a second `changed=` and relying on last-one-wins is legal,
        # unreadable, and makes the step untestable without knowing that rule.
        finish() { # finish <changed> <commit-sha>
          {
            echo "changed=$1"
            echo "commit=$2"
            echo "papers<<CLUEDOC_EOF"
            [ -n "$papers" ] && echo "$papers"
            echo "CLUEDOC_EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ "$PATHS" = "-A" ]; then
          git add -A
        else
          # Only the papers. The agent was told to write nothing else, and a
          # scoped `add` is what makes that instruction enforced rather than
          # merely requested.
          stray=$(git status --porcelain -- ':(exclude).cluedoc' | wc -l | tr -d ' ')
          if [ "$stray" != "0" ]; then
            echo "::warning::The agent changed ${stray} file(s) outside .cluedoc/. They were left uncommitted."
          fi
          git add -- .cluedoc
        fi

        papers=$(git diff --cached --name-only)
        if [ -z "$papers" ]; then
          echo "Cluedoc: no papers needed changing." >> "$GITHUB_STEP_SUMMARY"
          echo "Cluedoc: no papers needed changing."
          finish false ""
        fi

        count=$(echo "$papers" | wc -l | tr -d ' ')

        if [ "$INPUT_PUSH" != "true" ]; then
          git restore --staged .
          echo "Cluedoc: left ${count} paper(s) in the working tree." >> "$GITHUB_STEP_SUMMARY"
          finish true ""
        fi

        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$INPUT_COMMIT_MESSAGE"
        dropped=false

        # Stray edits are not part of the result, but they would stop a rebase
        # dead with "cannot rebase: You have unstaged changes" — turning a
        # recoverable race into a failed run, for files nobody was going to
        # keep. Discarded here rather than before the commit, so the warning
        # above still reports what the agent actually did.
        git checkout -- . 2>/dev/null || true

        if ! git push -q origin "HEAD:${BRANCH}" 2>/dev/null; then
          # Somebody pushed while the agent was working. Rebase rather than
          # force: their commit is real work and ours is regenerable.
          git fetch -q origin "$BRANCH"

          if ! git rebase -q "origin/${BRANCH}" >/dev/null 2>&1; then
            unmerged=$(git diff --name-only --diff-filter=U)
            outside=$(echo "$unmerged" | grep -v '^\.cluedoc/' || true)

            if [ -n "$outside" ]; then
              git rebase --abort || true
              echo "::error::Conflict outside .cluedoc/ while rebasing onto ${BRANCH}. Cluedoc will not resolve that."
              exit 1
            fi

            # Papers are derived, so the losing side is not lost work — it is
            # work the next sync redoes from the code. During a rebase `--ours`
            # is the branch being rebased ONTO, which is what the remote already
            # has. This is the README's manual recipe, automated.
            echo "$unmerged" | while IFS= read -r f; do
              [ -n "$f" ] && git checkout --ours -- "$f"
            done
            git add -- .cluedoc

            # Taking the remote's version can leave nothing to commit: the
            # papers already say what ours would have said.
            if ! GIT_EDITOR=true git rebase --continue >/dev/null 2>&1; then
              GIT_EDITOR=true git rebase --skip >/dev/null 2>&1
            fi

            echo "Cluedoc: a paper conflicted with ${BRANCH} and the branch's version was kept. The next sync regenerates it." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Did our commit survive the rebase? Asked by position rather than by
          # SHA: a rebase rewrites the commit, so comparing the SHA we made
          # against HEAD reports every successful rebase as a drop. Landing
          # exactly on the remote's tip means there is nothing of ours left —
          # either the conflict resolution emptied it, or the branch already
          # said what we were going to say.
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${BRANCH}")" ]; then
            dropped=true
          else
            git push -q origin "HEAD:${BRANCH}"
          fi
        fi

        if [ "$dropped" = "true" ]; then
          echo "Cluedoc: the sync was superseded by ${BRANCH} and produced no commit." >> "$GITHUB_STEP_SUMMARY"
          papers=""
          finish false ""
        fi

        {
          echo "Cluedoc synced ${count} paper(s):"
          echo "$papers" | sed 's/^/- /'
        } >> "$GITHUB_STEP_SUMMARY"
        finish true "$(git rev-parse HEAD)"

    # ----------------------------------------------------------------- comment
    # One comment per pull request, rewritten in place. Silent when nothing
    # changed: a bot that comments on every PR that touched a test file trains
    # people to filter it, and then it goes unread on the PR where it mattered.
    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && steps.commit.outputs.changed == 'true' && steps.commit.outputs.commit != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PAPERS: ${{ steps.commit.outputs.papers }}
        SHA: ${{ steps.commit.outputs.commit }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker='<!-- cluedoc:action -->'

        count=$(echo "$PAPERS" | wc -l | tr -d ' ')
        {
          echo "$marker"
          echo "**Cluedoc** synced ${count} paper(s)."
          echo
          # Linked at the docs commit, not at the branch: a branch link goes
          # stale the moment the pull request moves on, and these links exist to
          # be read as rendered Markdown rather than as a prose diff.
          echo "$PAPERS" | while IFS= read -r f; do
            [ -n "$f" ] && echo "- [\`${f}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SHA}/${f})"
          done
        } > "${RUNNER_TEMP:-/tmp}/cluedoc-comment.md"

        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"${marker}\"))] | .[0].id // empty" 2>/dev/null || true)

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
            -F body=@"${RUNNER_TEMP:-/tmp}/cluedoc-comment.md" --silent
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            -F body=@"${RUNNER_TEMP:-/tmp}/cluedoc-comment.md" --silent
        fi
